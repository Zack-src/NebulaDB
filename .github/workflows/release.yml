name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
    services:
      nebuladb-test-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nebuladb_test
          POSTGRES_PASSWORD: nebuladb_test
          POSTGRES_DB: nebuladb_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U nebuladb_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

      # Release notes: the CHANGELOG section for this tag's version, falling
      # back to [Unreleased] when no dated section exists yet.
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]") > 0) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            awk '/^## \[Unreleased\]/ { found = 1; next } /^## \[/ { if (found) exit } found { print }' CHANGELOG.md > RELEASE_NOTES.md
          fi
          if [ ! -s RELEASE_NOTES.md ]; then echo "See CHANGELOG.md." > RELEASE_NOTES.md; fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
