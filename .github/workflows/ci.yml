name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Throwaway Postgres/MySQL, same ports/credentials as docker-compose.test.yml.
    # The Postgres one is required: every server test file creates a database
    # of its own on it for NebulaDB's storage (and the Postgres driver tests
    # deploy to it). Without MySQL, its driver tests skip themselves.
    services:
      nebuladb-test-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nebuladb_test
          POSTGRES_PASSWORD: nebuladb_test
          POSTGRES_DB: nebuladb_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U nebuladb_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      nebuladb-test-mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nebuladb_test
          MYSQL_DATABASE: nebuladb_test
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -pnebuladb_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines range in package.json; better-sqlite3 builds
          # from source here, so the Node major has to be one it supports.
          node-version: 22
          cache: npm

      # `npm ci` runs the root postinstall, which builds packages/shared and
      # packages/dbml-engine — everything downstream depends on those.
      - run: npm ci

      - name: Lint
        run: npm run lint

      # Blocking, not `continue-on-error`: unlike the audit step below, this
      # starts clean (0 cycles across all four workspaces) rather than with a
      # pre-existing finding to grandfather in, so there's nothing to ignore.
      - name: Check for circular dependencies
        run: npm run check:circular

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: GitHub Action script
        run: bash actions/nebuladb/run.test.sh

      - name: Test
        run: npm test

      # Blocking: a high or critical advisory in a production dependency fails
      # the run. Dev-only dependencies are left out (`--omit=dev`): the known
      # moderate esbuild dev-server finding is reachable only through
      # `npm run dev` and is tracked in docs/todo.md.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Image must build and have no fixable HIGH/CRITICAL CVE. Nothing is pushed.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nebuladb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: nebuladb:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Playwright suites (apps/web/e2e) drive the system Chrome that ubuntu-latest
  # ships. Run on main, nightly and on demand rather than every PR (slow).
  e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      nebuladb-test-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nebuladb_test
          POSTGRES_PASSWORD: nebuladb_test
          POSTGRES_DB: nebuladb_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U nebuladb_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e

  # SQL Server driver tests (skip themselves locally when nothing listens).
  # Same image/credentials as docker-compose.mssql.yml. Non-blocking until the
  # tests' expected env/ports are confirmed on a real runner.
  mssql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    services:
      nebuladb-test-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nebuladb_test
          POSTGRES_PASSWORD: nebuladb_test
          POSTGRES_DB: nebuladb_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U nebuladb_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      nebuladb-test-mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Nebula_Test123!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/server
      - run: npm run test -w apps/server
