services:
  nebuladb:
    build: .
    ports:
      - "${PORT:-3001}:3001"
    # The same root .env as `npm run dev` (optional settings: SMTP, retention...);
    # the values below always win over it.
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container; the host side is PORT above.
      PORT: 3001
      NEBULADB_DATABASE_URL: postgres://nebuladb:${NEBULADB_POSTGRES_PASSWORD:?set NEBULADB_POSTGRES_PASSWORD}@postgres:5432/nebuladb
      # Encrypts stored database credentials, 2FA secrets and webhook secrets; connections, 2FA and
      # webhooks fail without it. `openssl rand -hex 32`, kept in the .env next to this file.
      NEBULADB_SECRET: ${NEBULADB_SECRET:-}
    # Backups of connected databases are still files: they stay on this volume.
    volumes:
      - nebuladb-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # The app logs structured JSON to stdout and never rotates or deletes
    # anything itself — that's the container runtime's job, and Docker's own
    # default (the json-file driver with no size cap) grows unbounded on the
    # host disk otherwise. Rotated here so a fresh install is safe by
    # default; see the README's "Logs" section for the bare-process
    # (non-Docker) equivalent.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # NebulaDB's own data. Not published on the host: only the app reaches it.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nebuladb
      POSTGRES_PASSWORD: ${NEBULADB_POSTGRES_PASSWORD:?set NEBULADB_POSTGRES_PASSWORD}
      POSTGRES_DB: nebuladb
    volumes:
      - nebuladb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebuladb -d nebuladb"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  nebuladb-postgres:
    name: ${NEBULADB_POSTGRES_VOLUME:-nebuladb-postgres}
  nebuladb-data:
    # Set this to the existing volume's physical name when upgrading.
    name: ${NEBULADB_DATA_VOLUME:-nebuladb-data}
