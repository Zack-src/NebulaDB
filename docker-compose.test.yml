# Throwaway Postgres/MySQL instances for the server tests. Not part of the
# app's own stack (see docker-compose.yml) and never referenced by it —
# separate ports, separate volumes, safe to run alongside a real deployment.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d nebuladb-test-postgres   # required
#   docker compose -f docker-compose.test.yml up -d                          # + MySQL driver tests
#   npm run build -w apps/server && npm run test -w apps/server
#   docker compose -f docker-compose.test.yml down -v
#
# The Postgres one is required: each server test file creates (and drops) a
# database of its own on it for NebulaDB's storage. The MySQL driver tests
# skip themselves with an explanatory message if that one isn't running.
services:
  nebuladb-test-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nebuladb_test
      POSTGRES_PASSWORD: nebuladb_test
      POSTGRES_DB: nebuladb_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data # scratch data — never needs to survive a restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebuladb_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  nebuladb-test-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: nebuladb_test
      MYSQL_DATABASE: nebuladb_test
    ports:
      - "53306:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pnebuladb_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Backup destinations (apps/server/src/modules/backups/stores/*.test.ts).
  nebuladb-test-minio:
    # Docker Hub no longer carries minio/minio; Chainguard publishes a maintained build.
    image: cgr.dev/chainguard/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: nebuladb_test
      MINIO_ROOT_PASSWORD: nebuladb_test_secret
    ports:
      - "59000:9000"
    tmpfs:
      - /data:mode=1777

  nebuladb-test-sftp:
    image: atmoz/sftp:alpine
    # user:password:uid:gid:folder — the folder is the only writable one inside the user's chroot.
    command: nebuladb_test:nebuladb_test_pw:::upload
    ports:
      - "52222:22"
